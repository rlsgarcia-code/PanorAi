name: panorai-workbench

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PANORAI_WORKBENCH_POSTGRES_DB:-panorai_workbench}
      POSTGRES_USER: ${PANORAI_WORKBENCH_POSTGRES_USER:-panorai_workbench}
      POSTGRES_PASSWORD: ${PANORAI_WORKBENCH_POSTGRES_PASSWORD:-local-workbench-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - workbench-postgres:/var/lib/postgresql/data

  object-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${PANORAI_WORKBENCH_S3_ACCESS_KEY_ID:-panorai-local}
      MINIO_ROOT_PASSWORD: ${PANORAI_WORKBENCH_S3_SECRET_ACCESS_KEY:-panorai-local-secret}
    volumes:
      - workbench-objects:/data

  backend:
    build:
      context: ..
      dockerfile: workbench/Dockerfile
    environment:
      PANORAI_WORKBENCH_PERSISTENCE: replicated
      PANORAI_WORKBENCH_DATABASE_URL: postgresql://${PANORAI_WORKBENCH_POSTGRES_USER:-panorai_workbench}:${PANORAI_WORKBENCH_POSTGRES_PASSWORD:-local-workbench-only}@postgres:5432/${PANORAI_WORKBENCH_POSTGRES_DB:-panorai_workbench}
      PANORAI_WORKBENCH_S3_ENDPOINT_URL: http://object-store:9000
      PANORAI_WORKBENCH_S3_BUCKET: ${PANORAI_WORKBENCH_S3_BUCKET:-panorai-workbench}
      PANORAI_WORKBENCH_S3_ACCESS_KEY_ID: ${PANORAI_WORKBENCH_S3_ACCESS_KEY_ID:-panorai-local}
      PANORAI_WORKBENCH_S3_SECRET_ACCESS_KEY: ${PANORAI_WORKBENCH_S3_SECRET_ACCESS_KEY:-panorai-local-secret}
      PANORAI_WORKBENCH_BOOTSTRAP_STORAGE: "true"
      PANORAI_WORKBENCH_HOME: /var/lib/panorai-workbench
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - workbench-cache:/var/lib/panorai-workbench

  frontend:
    image: node:22-alpine
    working_dir: /workspace/workbench
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      PANORAI_WORKBENCH_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/workspace/workbench:ro
      - workbench-node-modules:/workspace/workbench/node_modules

volumes:
  workbench-postgres:
  workbench-objects:
  workbench-cache:
  workbench-node-modules:
