<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" role="img" aria-labelledby="title desc">
  <title>PanorAi core and application composition</title>
  <desc>An ERP with explicit support enters canonical geometry. A sphere-native branch composes spherical core operations, while a projection-domain branch samples views, runs a pinhole method, and fuses or lifts its results. Both produce typed spherical results consumed by application wrappers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f8fafc}.input{fill:#fff;stroke:#2563eb;stroke-width:2}.core{fill:#eef2ff;stroke:#7c3aed;stroke-width:2}.native{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.project{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.result{fill:#ecfdf5;stroke:#059669;stroke-width:2}.app{fill:#fff;stroke:#334155;stroke-width:2}.t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:600;fill:#172033;text-anchor:middle}.s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:400;fill:#475569;text-anchor:middle}.label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;fill:#64748b;text-anchor:middle;letter-spacing:1px}.e{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.canvas{fill:#10151d}.input,.app{fill:#18202b;stroke:#94a3b8}.core{fill:#231b38;stroke:#a78bfa}.native{fill:#102a31;stroke:#22d3ee}.project{fill:#2b2115;stroke:#fb923c}.result{fill:#102820;stroke:#34d399}.t{fill:#f1f5f9}.s,.label{fill:#cbd5e1}.e{stroke:#94a3b8}}
    </style>
  </defs>
  <rect class="canvas" width="1320" height="610" rx="18"/>

  <text class="label" x="170" y="52">SPHERICAL DATA</text>
  <rect class="input" x="35" y="72" width="270" height="104" rx="16"/>
  <text class="t" x="170" y="111">ERP / bearings</text>
  <text class="s" x="170" y="138">values + validity + support</text>
  <path class="e" d="M305 124 H370"/>

  <text class="label" x="520" y="52">SHARED FOUNDATION</text>
  <rect class="core" x="370" y="72" width="300" height="104" rx="16"/>
  <text class="t" x="520" y="108">Canonical geometry</text>
  <text class="s" x="520" y="134">rays · projectors · interpolation</text>
  <text class="s" x="520" y="155">pixel centres · masks · provenance</text>

  <path class="e" d="M520 176 V222 H305 V265"/>
  <path class="e" d="M520 176 V222 H835 V265"/>

  <text class="label" x="305" y="246">SPHERE-NATIVE COMPOSITION</text>
  <rect class="native" x="70" y="265" width="470" height="120" rx="16"/>
  <text class="t" x="305" y="302">panorai.core NumPy / Torch</text>
  <text class="s" x="305" y="329">conv · filter · pool · resize</text>
  <text class="s" x="305" y="353">neighbourhood · area reduction</text>

  <text class="label" x="835" y="246">PROJECTION-DOMAIN COMPOSITION</text>
  <rect class="project" x="600" y="265" width="470" height="120" rx="16"/>
  <text class="t" x="835" y="302">sample → pinhole method → return</text>
  <text class="s" x="835" y="329">back-project raster fields</text>
  <text class="s" x="835" y="353">lift points / regions / view evidence</text>

  <path class="e" d="M305 385 V430 H570"/>
  <path class="e" d="M835 385 V430 H750"/>
  <rect class="result" x="500" y="410" width="320" height="88" rx="16"/>
  <text class="t" x="660" y="446">Typed spherical results</text>
  <text class="s" x="660" y="472">fields · bearings · regions · poses · 3-D</text>
  <path class="e" d="M660 498 V535"/>

  <text class="label" x="1030" y="436">APPLICATION LAYER</text>
  <rect class="app" x="880" y="456" width="405" height="118" rx="16"/>
  <text class="t" x="1082" y="491">Wrappers compose the core</text>
  <text class="s" x="1082" y="518">features · pose · range · reconstruction</text>
  <text class="s" x="1082" y="542">SLAM · CAM · semantic association</text>
  <path class="e" d="M820 454 H880"/>
</svg>
