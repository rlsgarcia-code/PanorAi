<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 330" role="img" aria-labelledby="title desc">
  <title>Spherical feature extraction and matching</title>
  <desc>An ERP and validity mask are sampled into gnomonic views, processed by OpenCV, converted into spherical bearings and deduplicated, then matched with provenance to produce SphericalFeatureMatches.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f8fafc}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.cv{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.result{fill:#ecfdf5;stroke:#059669;stroke-width:2}.t{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#172033;text-anchor:middle}.s{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#475569;text-anchor:middle}.e{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.canvas{fill:#10151d}.box{fill:#18202b;stroke:#60a5fa}.cv{fill:#2b2115;stroke:#fb923c}.result{fill:#102820;stroke:#34d399}.t{fill:#f1f5f9}.s{fill:#cbd5e1}.e{stroke:#94a3b8}}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="330" rx="18"/>
  <rect class="box" x="30" y="106" width="205" height="116" rx="14"/><text class="t" x="132" y="148">ERP + validity</text><text class="s" x="132" y="178">central panorama</text><text class="s" x="132" y="201">explicit mask</text>
  <path class="e" d="M235 164 H280"/>
  <rect class="box" x="280" y="82" width="230" height="164" rx="14"/><text class="t" x="395" y="124">PanorAi sampler</text><text class="s" x="395" y="154">gnomonic views</text><text class="s" x="395" y="177">geometry + provenance</text><text class="s" x="395" y="200">support-aware crops</text>
  <path class="e" d="M510 164 H555"/>
  <rect class="cv" x="555" y="106" width="220" height="116" rx="14"/><text class="t" x="665" y="148">OpenCV</text><text class="s" x="665" y="178">detect + describe</text><text class="s" x="665" y="201">SIFT · ORB · AKAZE</text>
  <path class="e" d="M775 164 H820"/>
  <rect class="box" x="820" y="82" width="245" height="164" rx="14"/><text class="t" x="942" y="124">Spherical features</text><text class="s" x="942" y="154">pixels → unit bearings</text><text class="s" x="942" y="177">angular deduplication</text><text class="s" x="942" y="200">SphericalFeatureSet</text>
  <path class="e" d="M1065 164 H1110"/>
  <rect class="cv" x="1110" y="106" width="170" height="116" rx="14"/><text class="t" x="1195" y="148">OpenCV</text><text class="s" x="1195" y="178">BF / FLANN</text><text class="s" x="1195" y="201">descriptor search</text>
  <path class="e" d="M1280 164 H1325"/>
  <rect class="result" x="1325" y="82" width="145" height="164" rx="14"/><text class="t" x="1397" y="124">PanorAi</text><text class="s" x="1397" y="154">match provenance</text><text class="s" x="1397" y="177">bearing pairs</text><text class="s" x="1397" y="200">stable result</text>
</svg>
