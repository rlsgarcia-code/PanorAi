<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">PanorAi spherical computer-vision themes</title>
  <desc id="desc">A spherical image passes through projection and preprocessing, features and matching, and two-view geometry before branching to multiview reconstruction, dense stereo, and SLAM.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b78"/>
    </marker>
    <style>
      .box{fill:#f5f9fc;stroke:#315b78;stroke-width:2;rx:14}
      .sphere{fill:#e7f3ee;stroke:#26725b}
      .hybrid{fill:#fff6e8;stroke:#9a6424}
      .text{font:600 17px system-ui,sans-serif;fill:#183042;text-anchor:middle}
      .small{font:14px system-ui,sans-serif;fill:#365466;text-anchor:middle}
      .line{fill:none;stroke:#315b78;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box hybrid" x="30" y="145" width="180" height="86"/>
  <text class="text" x="120" y="177">Projection &amp;</text><text class="text" x="120" y="199">preprocessing</text><text class="small" x="120" y="219">ERP / central fisheye</text>
  <rect class="box hybrid" x="270" y="145" width="180" height="86"/>
  <text class="text" x="360" y="177">Features &amp;</text><text class="text" x="360" y="199">matching</text><text class="small" x="360" y="219">matched bearings</text>
  <rect class="box sphere" x="510" y="145" width="180" height="86"/>
  <text class="text" x="600" y="177">Two-view</text><text class="text" x="600" y="199">geometry</text><text class="small" x="600" y="219">R, t direction, points</text>
  <rect class="box sphere" x="790" y="25" width="280" height="76"/>
  <text class="text" x="930" y="57">Multiview reconstruction</text><text class="small" x="930" y="80">poses + sparse 3D map</text>
  <rect class="box sphere" x="790" y="157" width="280" height="76"/>
  <text class="text" x="930" y="189">Spherical dense stereo</text><text class="small" x="930" y="212">dense radial range</text>
  <rect class="box hybrid" x="790" y="289" width="280" height="76"/>
  <text class="text" x="930" y="321">SLAM</text><text class="small" x="930" y="344">online trajectory + map</text>
  <path class="line" d="M210 188 H270"/><path class="line" d="M450 188 H510"/>
  <path class="line" d="M690 180 C740 180 735 63 790 63"/>
  <path class="line" d="M690 188 H790"/>
  <path class="line" d="M690 197 C740 197 735 327 790 327"/>
  <text class="small" x="600" y="278">Sphere-native geometry branches after local visual evidence</text>
</svg>
