<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">PanorAi product capability map</title>
  <desc id="desc">Central spherical imagery passes through stable geometry and workflow foundations. Experimental visual, pose, mapping, depth, and semantic evidence can then be materialized as a replayable spatial-semantic graph with explicit provenance and uncertainty.</desc>
  <defs>
    <style>
      .canvas{fill:#f8fafc}.input{fill:#fff;stroke:#475569;stroke-width:2}.stable{fill:#ecfdf5;stroke:#059669;stroke-width:2.5}.experimental{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.graph{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2.5}.output{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.title{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}.text{font-family:Arial,sans-serif;font-size:17px;font-weight:700;fill:#172033;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:13px;fill:#64748b;text-anchor:middle}.legend{font-family:Arial,sans-serif;font-size:13px;font-weight:600;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2.5}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}
      @media(prefers-color-scheme:dark){.canvas{fill:#0b1120}.input{fill:#111827;stroke:#94a3b8}.stable{fill:#052e2b;stroke:#34d399}.experimental{fill:#431407;stroke:#fb923c}.graph{fill:#2e1065;stroke:#a78bfa}.output{fill:#172554;stroke:#60a5fa}.title,.text{fill:#f8fafc}.small,.legend{fill:#cbd5e1}.line,.dash{stroke:#94a3b8}}
    </style>
  </defs>
  <rect class="canvas" width="1280" height="480" rx="22"/>
  <text class="title" x="38" y="46">From 360° imagery to explicit, queryable evidence</text>
  <rect class="stable" x="930" y="24" width="18" height="18" rx="4"/><text class="legend" x="958" y="38">Stable foundation</text>
  <rect class="experimental" x="1080" y="24" width="18" height="18" rx="4"/><text class="legend" x="1108" y="38">Experimental frontier</text>

  <rect class="input" x="35" y="188" width="170" height="100" rx="18"/>
  <text class="text" x="120" y="226">360° imagery</text><text class="small" x="120" y="251">ERP · central fisheye</text><text class="small" x="120" y="272">RGB · range · labels</text>

  <rect class="stable" x="260" y="158" width="245" height="160" rx="20"/>
  <text class="text" x="382" y="195">Geometry + workflow</text><text class="small" x="382" y="222">projection · rays · validity</text><text class="small" x="382" y="244">sampling · multimodal grids</text><text class="small" x="382" y="266">fusion · feature core</text><text class="small" x="382" y="296">Stable / Compatibility</text>
  <line x1="205" y1="238" x2="254" y2="238" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <rect class="experimental" x="565" y="78" width="245" height="92" rx="18"/>
  <text class="text" x="688" y="112">Visual evidence</text><text class="small" x="688" y="136">filters · detections · descriptors</text><text class="small" x="688" y="156">learned frontends</text>
  <rect class="experimental" x="565" y="194" width="245" height="92" rx="18"/>
  <text class="text" x="688" y="228">Pose + mapping</text><text class="small" x="688" y="252">relative pose · depth · stereo</text><text class="small" x="688" y="272">reconstruction · BA · SLAM</text>
  <rect class="experimental" x="565" y="310" width="245" height="92" rx="18"/>
  <text class="text" x="688" y="344">Semantic evidence</text><text class="small" x="688" y="368">segmentation · regions</text><text class="small" x="688" y="388">feature-indexed observations</text>
  <line x1="505" y1="215" x2="532" y2="215" stroke="#64748b" stroke-width="3"/><line x1="532" y1="215" x2="532" y2="124" stroke="#64748b" stroke-width="3"/><line x1="532" y1="124" x2="559" y2="124" stroke="#64748b" stroke-width="3"/><line x1="505" y1="238" x2="559" y2="238" stroke="#64748b" stroke-width="3"/><line x1="505" y1="261" x2="532" y2="261" stroke="#64748b" stroke-width="3"/><line x1="532" y1="261" x2="532" y2="356" stroke="#64748b" stroke-width="3"/><line x1="532" y1="356" x2="559" y2="356" stroke="#64748b" stroke-width="3"/>

  <rect class="graph" x="870" y="158" width="235" height="160" rx="20"/>
  <text class="text" x="988" y="195">Spatial-semantic graph</text><text class="small" x="988" y="222">association · posterior</text><text class="small" x="988" y="244">entity lifecycle · lineage</text><text class="small" x="988" y="266">deterministic replay</text><text class="small" x="988" y="296">Experimental in 3.7</text>
  <line x1="810" y1="124" x2="838" y2="124" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="838" y1="124" x2="838" y2="205" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="838" y1="205" x2="864" y2="205" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="810" y1="240" x2="864" y2="240" stroke="#64748b" stroke-width="3"/><line x1="810" y1="356" x2="838" y2="356" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="838" y1="356" x2="838" y2="272" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="838" y1="272" x2="864" y2="272" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>

  <rect class="output" x="1160" y="178" width="90" height="120" rx="18"/>
  <text class="text" x="1205" y="215">Use</text><text class="small" x="1205" y="240">query</text><text class="small" x="1205" y="261">archive</text><text class="small" x="1205" y="282">inspect</text>
  <line x1="1105" y1="238" x2="1154" y2="238" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <text class="small" x="640" y="445">Frames, units, scale, validity, uncertainty, provenance, and stability remain explicit throughout.</text>
</svg>
