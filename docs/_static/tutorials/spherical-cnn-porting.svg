<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
  <title>Porting pretrained CNNs to direct spherical inference</title>
  <desc>A pretrained planar CNN keeps its learned parameters while planar convolution, transposed convolution, and max pooling are replaced by spherical operations. The resulting model consumes an ERP directly and produces either radial range or dense class activation evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f8fafc}.input{fill:#fff;stroke:#2563eb;stroke-width:2}.planar{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.port{fill:#eef2ff;stroke:#7c3aed;stroke-width:2}.sphere{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.output{fill:#ecfdf5;stroke:#059669;stroke-width:2}.t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:700;fill:#172033;text-anchor:middle}.s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569;text-anchor:middle}.label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:700;fill:#64748b;text-anchor:middle;letter-spacing:1px}.edge{fill:none;stroke:#64748b;stroke-width:2.4;marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.canvas{fill:#10151d}.input{fill:#18202b;stroke:#60a5fa}.planar{fill:#2b2115;stroke:#fb923c}.port{fill:#231b38;stroke:#a78bfa}.sphere{fill:#102a31;stroke:#22d3ee}.output{fill:#102820;stroke:#34d399}.t{fill:#f1f5f9}.s,.label{fill:#cbd5e1}.edge{stroke:#94a3b8}}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="360" rx="18"/>

  <text class="label" x="130" y="44">PRETRAINED MODEL</text>
  <rect class="planar" x="30" y="65" width="200" height="190" rx="16"/>
  <text class="t" x="130" y="104">Planar CNN</text>
  <text class="s" x="130" y="136">Conv2d</text>
  <text class="s" x="130" y="160">ConvTranspose2d</text>
  <text class="s" x="130" y="184">MaxPool2d</text>
  <text class="s" x="130" y="224">learned weights</text>
  <text class="t" x="258" y="168">→</text>

  <text class="label" x="405" y="44">PORT WITH REPORT</text>
  <rect class="port" x="285" y="65" width="240" height="190" rx="16"/>
  <text class="t" x="405" y="104">Preserve parameters</text>
  <text class="s" x="405" y="136">Conv2d → SphericalConv2d</text>
  <text class="s" x="405" y="160">ConvT → SphericalConvT</text>
  <text class="s" x="405" y="184">MaxPool → SphericalMaxPool</text>
  <text class="s" x="405" y="224">audit every replacement</text>
  <text class="t" x="553" y="168">→</text>

  <text class="label" x="700" y="44">DIRECT ERP INFERENCE</text>
  <rect class="sphere" x="580" y="65" width="240" height="190" rx="16"/>
  <text class="t" x="700" y="104">Spherical CNN</text>
  <text class="s" x="700" y="136">local tangent kernels</text>
  <text class="s" x="700" y="160">longitude wrapping</text>
  <text class="s" x="700" y="184">solid-angle reduction</text>
  <text class="s" x="700" y="224">ERP in · no faces</text>
  <text class="t" x="848" y="168">→</text>

  <text class="label" x="1025" y="44">DENSE SPHERICAL OUTPUT</text>
  <rect class="output" x="875" y="65" width="295" height="86" rx="16"/>
  <text class="t" x="1023" y="101">Metric depth</text>
  <text class="s" x="1023" y="127">radial range · validity · provenance</text>
  <rect class="output" x="875" y="169" width="295" height="86" rx="16"/>
  <text class="t" x="1023" y="205">Class activation</text>
  <text class="s" x="1023" y="231">dense class lattice · CAM · score</text>

  <text class="s" x="600" y="320">Weights stay attached to the original Parameter objects; spatial sampling changes from planar offsets to spherical tangent neighbourhoods.</text>
</svg>
