<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three geometric routes for spherical computer vision</title>
  <desc id="desc">Projection-domain sampling transfers spherical data to tangent pinhole views and back, sphere-native operators follow angular neighbourhoods directly, and hybrid multiview methods associate bearings and regions across registered spheres.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101d34"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="28%">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="0.65" stop-color="#0c2f48"/>
      <stop offset="1" stop-color="#071827"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="#0f172a"/>
  <text x="800" y="74" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="34" font-weight="700">ONE SPHERE · THREE EXECUTION ROUTES</text>
  <path d="M533 118V822M1067 118V822" stroke="#334155" stroke-width="2"/>

  <!-- Projection-domain -->
  <text x="267" y="148" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="31" font-weight="700">PROJECTION-DOMAIN</text>
  <circle cx="195" cy="365" r="118" fill="#0b2538" stroke="#38bdf8" stroke-width="5"/>
  <ellipse cx="195" cy="365" rx="118" ry="38" fill="none" stroke="#7dd3fc" stroke-opacity=".58" stroke-width="3"/>
  <ellipse cx="195" cy="365" rx="40" ry="118" fill="none" stroke="#7dd3fc" stroke-opacity=".48" stroke-width="3"/>
  <path d="M99 297Q195 250 291 297M99 433Q195 480 291 433" fill="none" stroke="#7dd3fc" stroke-opacity=".34" stroke-width="2"/>
  <line x1="224" y1="323" x2="410" y2="249" stroke="#facc15" stroke-width="4"/>
  <line x1="242" y1="365" x2="410" y2="365" stroke="#facc15" stroke-width="4"/>
  <line x1="224" y1="407" x2="410" y2="481" stroke="#facc15" stroke-width="4"/>
  <path d="M397 244L410 249L402 261ZM395 357L410 365L395 373ZM397 486L410 481L402 469Z" fill="#facc15"/>
  <path d="M410 235L496 276V454L410 495Z" fill="#e2e8f0" fill-opacity=".10" stroke="#facc15" stroke-width="5"/>
  <path d="M425 285H480M425 330H480M425 375H480M425 420H480M445 264V470" stroke="#f8fafc" stroke-opacity=".38" stroke-width="2"/>
  <rect x="115" y="570" width="304" height="92" rx="20" fill="#0f2940" stroke="#38bdf8" stroke-width="3"/>
  <path d="M144 616H390" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="176" cy="616" r="15" fill="#facc15"/><circle cx="250" cy="616" r="15" fill="#f472b6"/><circle cx="324" cy="616" r="15" fill="#4ade80"/>
  <path d="M419 616C486 616 493 525 463 474" fill="none" stroke="#38bdf8" stroke-width="5"/>
  <path d="M452 488L463 474L470 491Z" fill="#38bdf8"/>
  <text x="267" y="724" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="25" font-weight="600">sample tangent views</text>
  <text x="267" y="760" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="23">run pinhole methods · recompose</text>

  <!-- Sphere-native -->
  <text x="800" y="148" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="31" font-weight="700">SPHERE-NATIVE</text>
  <circle cx="800" cy="400" r="196" fill="#0b2538" stroke="#4ade80" stroke-width="6"/>
  <ellipse cx="800" cy="400" rx="196" ry="62" fill="none" stroke="#86efac" stroke-opacity=".56" stroke-width="3"/>
  <ellipse cx="800" cy="400" rx="66" ry="196" fill="none" stroke="#86efac" stroke-opacity=".46" stroke-width="3"/>
  <path d="M631 302Q800 218 969 302M631 498Q800 582 969 498" fill="none" stroke="#86efac" stroke-opacity=".32" stroke-width="3"/>
  <path d="M683 254Q800 340 917 254M683 546Q800 460 917 546" fill="none" stroke="#86efac" stroke-opacity=".24" stroke-width="2"/>
  <ellipse cx="862" cy="319" rx="78" ry="50" transform="rotate(-20 862 319)" fill="#facc15" fill-opacity=".14" stroke="#facc15" stroke-width="5"/>
  <g fill="#facc15">
    <circle cx="816" cy="321" r="9"/><circle cx="840" cy="302" r="9"/><circle cx="865" cy="289" r="9"/>
    <circle cx="843" cy="328" r="9"/><circle cx="869" cy="316" r="12"/><circle cx="896" cy="307" r="9"/>
    <circle cx="866" cy="345" r="9"/><circle cx="895" cy="337" r="9"/>
  </g>
  <path d="M657 603C708 660 892 660 943 603" fill="none" stroke="#4ade80" stroke-width="6"/>
  <path d="M925 608L943 603L937 621Z" fill="#4ade80"/>
  <text x="800" y="724" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="25" font-weight="600">operate on angular neighbourhoods</text>
  <text x="800" y="760" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="23">seam-aware · no view reconstruction</text>

  <!-- Hybrid / multiview -->
  <text x="1333" y="148" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="31" font-weight="700">HYBRID · MULTIVIEW</text>
  <circle cx="1196" cy="438" r="112" fill="#0b2538" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="1470" cy="438" r="112" fill="#0b2538" stroke="#38bdf8" stroke-width="5"/>
  <ellipse cx="1196" cy="438" rx="112" ry="36" fill="none" stroke="#7dd3fc" stroke-opacity=".48" stroke-width="3"/>
  <ellipse cx="1470" cy="438" rx="112" ry="36" fill="none" stroke="#7dd3fc" stroke-opacity=".48" stroke-width="3"/>
  <ellipse cx="1196" cy="438" rx="37" ry="112" fill="none" stroke="#7dd3fc" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="1470" cy="438" rx="37" ry="112" fill="none" stroke="#7dd3fc" stroke-opacity=".38" stroke-width="3"/>
  <ellipse cx="1242" cy="396" rx="48" ry="31" transform="rotate(-24 1242 396)" fill="#facc15" fill-opacity=".18" stroke="#f472b6" stroke-width="4"/>
  <ellipse cx="1425" cy="395" rx="45" ry="35" transform="rotate(22 1425 395)" fill="#facc15" fill-opacity=".18" stroke="#f472b6" stroke-width="4"/>
  <circle cx="1334" cy="235" r="17" fill="#f472b6" stroke="#f8fafc" stroke-width="5"/>
  <line x1="1196" y1="438" x2="1334" y2="235" stroke="#4ade80" stroke-width="5"/>
  <line x1="1470" y1="438" x2="1334" y2="235" stroke="#4ade80" stroke-width="5"/>
  <line x1="1196" y1="438" x2="1470" y2="438" stroke="#facc15" stroke-width="5" stroke-dasharray="12 10"/>
  <circle cx="1248" cy="378" r="7" fill="#4ade80"/><circle cx="1420" cy="378" r="7" fill="#4ade80"/>
  <path d="M1248 378Q1334 303 1420 378" fill="none" stroke="#4ade80" stroke-width="4" stroke-dasharray="9 8"/>
  <rect x="1193" y="590" width="280" height="78" rx="20" fill="#2b1832" stroke="#f472b6" stroke-width="3"/>
  <path d="M1230 630H1436" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1272" cy="630" r="12" fill="#38bdf8"/><circle cx="1334" cy="630" r="12" fill="#facc15"/><circle cx="1396" cy="630" r="12" fill="#4ade80"/>
  <text x="1333" y="724" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="25" font-weight="600">associate registered bearings and regions</text>
  <text x="1333" y="760" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="23">pose · range · shared hypotheses</text>

  <text x="800" y="846" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="22">The API keeps the chosen geometry, support, interpolation, and evidence provenance explicit.</text>
</svg>
