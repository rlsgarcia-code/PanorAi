<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three geometric routes for spherical computer vision</title>
  <desc id="desc">Projection-domain sampling transfers spherical data to tangent pinhole views and back, sphere-native operators follow angular neighbourhoods directly, and hybrid multiview methods associate bearings and regions across registered spheres.</desc>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="1" y="1" width="1598" height="898" fill="none" stroke="#bfbfbf" stroke-width="2"/>
  <text x="70" y="64" fill="#262626" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">One sphere, three execution routes</text>
  <text x="70" y="101" fill="#595959" font-family="Arial,Helvetica,sans-serif" font-size="21">Choose the computational domain while keeping geometry, support, interpolation, and provenance explicit.</text>
  <path d="M533 126V818M1067 126V818" stroke="#d9d9d9" stroke-width="2"/>
  <g stroke="#eeeeee" stroke-width="1" stroke-dasharray="5 7">
    <path d="M40 206H1560M40 400H1560M40 594H1560M40 788H1560"/>
  </g>

  <!-- Projection-domain -->
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="267" y="161" text-anchor="middle" fill="#0072BD" font-size="29" font-weight="700">PROJECTION-DOMAIN</text>
    <circle cx="195" cy="365" r="118" fill="#eef6fb" stroke="#0072BD" stroke-width="4"/>
    <ellipse cx="195" cy="365" rx="118" ry="38" fill="none" stroke="#0072BD" stroke-opacity=".70" stroke-width="2.5"/>
    <ellipse cx="195" cy="365" rx="40" ry="118" fill="none" stroke="#0072BD" stroke-opacity=".62" stroke-width="2.5"/>
    <path d="M99 297Q195 250 291 297M99 433Q195 480 291 433" fill="none" stroke="#0072BD" stroke-opacity=".40" stroke-width="2"/>
    <line x1="224" y1="323" x2="410" y2="249" stroke="#D95319" stroke-width="3"/>
    <line x1="242" y1="365" x2="410" y2="365" stroke="#D95319" stroke-width="3"/>
    <line x1="224" y1="407" x2="410" y2="481" stroke="#D95319" stroke-width="3"/>
    <path d="M397 244L410 249L402 261ZM395 357L410 365L395 373ZM397 486L410 481L402 469Z" fill="#D95319"/>
    <path d="M410 235L496 276V454L410 495Z" fill="#f7f7f7" stroke="#D95319" stroke-width="4"/>
    <path d="M425 285H480M425 330H480M425 375H480M425 420H480M445 264V470" stroke="#595959" stroke-opacity=".60" stroke-width="2"/>
    <rect x="115" y="570" width="304" height="92" fill="#f8fbfd" stroke="#0072BD" stroke-width="2.5"/>
    <path d="M144 616H390" fill="none" stroke="#0072BD" stroke-width="4"/>
    <circle cx="176" cy="616" r="13" fill="#EDB120"/><circle cx="250" cy="616" r="13" fill="#7E2F8E"/><circle cx="324" cy="616" r="13" fill="#77AC30"/>
    <path d="M419 616C486 616 493 525 463 474" fill="none" stroke="#0072BD" stroke-width="3"/>
    <path d="M452 488L463 474L470 491Z" fill="#0072BD"/>
    <text x="267" y="724" text-anchor="middle" fill="#262626" font-size="24" font-weight="700">sample tangent views</text>
    <text x="267" y="760" text-anchor="middle" fill="#595959" font-size="21">run pinhole methods · recompose</text>

    <!-- Sphere-native -->
    <text x="800" y="161" text-anchor="middle" fill="#477a1e" font-size="29" font-weight="700">SPHERE-NATIVE</text>
    <circle cx="800" cy="400" r="196" fill="#f4f8ef" stroke="#77AC30" stroke-width="4"/>
    <ellipse cx="800" cy="400" rx="196" ry="62" fill="none" stroke="#77AC30" stroke-opacity=".75" stroke-width="2.5"/>
    <ellipse cx="800" cy="400" rx="66" ry="196" fill="none" stroke="#77AC30" stroke-opacity=".70" stroke-width="2.5"/>
    <path d="M631 302Q800 218 969 302M631 498Q800 582 969 498" fill="none" stroke="#77AC30" stroke-opacity=".46" stroke-width="2.5"/>
    <path d="M683 254Q800 340 917 254M683 546Q800 460 917 546" fill="none" stroke="#77AC30" stroke-opacity=".30" stroke-width="2"/>
    <ellipse cx="862" cy="319" rx="78" ry="50" transform="rotate(-20 862 319)" fill="#fff8df" stroke="#EDB120" stroke-width="3"/>
    <g fill="#D95319">
      <circle cx="816" cy="321" r="8"/><circle cx="840" cy="302" r="8"/><circle cx="865" cy="289" r="8"/>
      <circle cx="843" cy="328" r="8"/><circle cx="869" cy="316" r="10"/><circle cx="896" cy="307" r="8"/>
      <circle cx="866" cy="345" r="8"/><circle cx="895" cy="337" r="8"/>
    </g>
    <path d="M657 603C708 660 892 660 943 603" fill="none" stroke="#77AC30" stroke-width="4"/>
    <path d="M925 608L943 603L937 621Z" fill="#77AC30"/>
    <text x="800" y="724" text-anchor="middle" fill="#262626" font-size="24" font-weight="700">operate on angular neighbourhoods</text>
    <text x="800" y="760" text-anchor="middle" fill="#595959" font-size="21">seam-aware · no view reconstruction</text>

    <!-- Hybrid / multiview -->
    <text x="1333" y="161" text-anchor="middle" fill="#7E2F8E" font-size="29" font-weight="700">HYBRID · MULTIVIEW</text>
    <circle cx="1196" cy="438" r="112" fill="#eef6fb" stroke="#0072BD" stroke-width="4"/>
    <circle cx="1470" cy="438" r="112" fill="#eef6fb" stroke="#0072BD" stroke-width="4"/>
    <ellipse cx="1196" cy="438" rx="112" ry="36" fill="none" stroke="#0072BD" stroke-opacity=".65" stroke-width="2.5"/>
    <ellipse cx="1470" cy="438" rx="112" ry="36" fill="none" stroke="#0072BD" stroke-opacity=".65" stroke-width="2.5"/>
    <ellipse cx="1196" cy="438" rx="37" ry="112" fill="none" stroke="#0072BD" stroke-opacity=".55" stroke-width="2.5"/>
    <ellipse cx="1470" cy="438" rx="37" ry="112" fill="none" stroke="#0072BD" stroke-opacity=".55" stroke-width="2.5"/>
    <ellipse cx="1242" cy="396" rx="48" ry="31" transform="rotate(-24 1242 396)" fill="#faf3fb" stroke="#7E2F8E" stroke-width="3"/>
    <ellipse cx="1425" cy="395" rx="45" ry="35" transform="rotate(22 1425 395)" fill="#faf3fb" stroke="#7E2F8E" stroke-width="3"/>
    <circle cx="1334" cy="235" r="17" fill="#7E2F8E" stroke="#ffffff" stroke-width="4"/>
    <line x1="1196" y1="438" x2="1334" y2="235" stroke="#77AC30" stroke-width="3.5"/>
    <line x1="1470" y1="438" x2="1334" y2="235" stroke="#77AC30" stroke-width="3.5"/>
    <line x1="1196" y1="438" x2="1470" y2="438" stroke="#D95319" stroke-width="3.5" stroke-dasharray="11 9"/>
    <circle cx="1248" cy="378" r="7" fill="#77AC30"/><circle cx="1420" cy="378" r="7" fill="#77AC30"/>
    <path d="M1248 378Q1334 303 1420 378" fill="none" stroke="#77AC30" stroke-width="3" stroke-dasharray="8 7"/>
    <rect x="1193" y="590" width="280" height="78" fill="#faf8fb" stroke="#7E2F8E" stroke-width="2.5"/>
    <path d="M1230 630H1436" stroke="#7E2F8E" stroke-width="4"/>
    <circle cx="1272" cy="630" r="11" fill="#0072BD"/><circle cx="1334" cy="630" r="11" fill="#EDB120"/><circle cx="1396" cy="630" r="11" fill="#77AC30"/>
    <text x="1333" y="724" text-anchor="middle" fill="#262626" font-size="24" font-weight="700">associate registered bearings and regions</text>
    <text x="1333" y="760" text-anchor="middle" fill="#595959" font-size="21">pose · range · shared hypotheses</text>
  </g>

  <text x="800" y="846" text-anchor="middle" fill="#595959" font-family="Arial,Helvetica,sans-serif" font-size="20">Computational domain</text>
  <path d="M210 816H1390" stroke="#404040" stroke-width="2"/>
  <path d="M210 808V824M800 808V824M1390 808V824" stroke="#404040" stroke-width="2"/>
</svg>
