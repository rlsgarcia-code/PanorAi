<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title>Known-height metric two-view geometry</title>
  <desc>Two camera centers stand at known optical-center heights above a common floor. A verified floor correspondence turns one ray into a metric floor point and determines the scale of the translation direction. The scaled pose then triangulates general scene points in metres.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .canvas{fill:#f8fafc}.floor{stroke:#475569;stroke-width:5}.grid{stroke:#cbd5e1;stroke-width:1.5}.ray{stroke:#2563eb;stroke-width:3;fill:none}.ray2{stroke:#7c3aed;stroke-width:3;fill:none}.base{stroke:#ea580c;stroke-width:4;fill:none;marker-end:url(#arrow)}.height{stroke:#059669;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.camera{fill:#fff;stroke:#172033;stroke-width:3}.point{fill:#e11d48}.floorpoint{fill:#059669}.label{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#172033}.small{font:15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.note{fill:#fff;stroke:#94a3b8;stroke-width:2}
      @media(prefers-color-scheme:dark){.canvas{fill:#10151d}.floor{stroke:#cbd5e1}.grid{stroke:#334155}.camera{fill:#18202b;stroke:#f1f5f9}.label{fill:#f1f5f9}.small{fill:#cbd5e1}.note{fill:#18202b;stroke:#64748b}}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="650" rx="18"/>
  <path class="grid" d="M80 540 L250 430 M230 540 L400 430 M380 540 L550 430 M530 540 L700 430 M680 540 L850 430 M830 540 L1000 430 M980 540 L1150 430"/>
  <line class="floor" x1="70" y1="540" x2="1140" y2="540"/>
  <text class="label" x="88" y="580">common planar floor</text><text class="small" x="88" y="605">gᵀX = 0 in the chosen world frame</text>
  <circle class="camera" cx="260" cy="300" r="20"/><path class="camera" d="M280 290 l42 -20 v60 l-42 -20 z"/><text class="label" x="220" y="260">camera A</text>
  <circle class="camera" cx="780" cy="300" r="20"/><path class="camera" d="M800 290 l42 -20 v60 l-42 -20 z"/><text class="label" x="740" y="260">camera B</text>
  <line class="height" x1="220" y1="535" x2="220" y2="305"/><text class="label" x="135" y="420">hₐ metres</text>
  <line class="height" x1="870" y1="535" x2="870" y2="305"/><text class="label" x="890" y="420">hᵦ metres</text>
  <path class="base" d="M290 300 H750"/><text class="label" x="465" y="280">s · Ĉᵦᴬ</text><text class="small" x="430" y="330">direction known; metric s initially unknown</text>
  <circle class="floorpoint" cx="575" cy="540" r="10"/><text class="label" x="590" y="525">verified floor match</text>
  <line class="ray" x1="260" y1="300" x2="575" y2="540"/><line class="ray2" x1="780" y1="300" x2="575" y2="540"/>
  <circle class="point" cx="610" cy="125" r="10"/><text class="label" x="630" y="118">general 3D point</text>
  <line class="ray" x1="260" y1="300" x2="610" y2="125"/><line class="ray2" x1="780" y1="300" x2="610" y2="125"/>
  <rect class="note" x="55" y="36" width="440" height="112" rx="14"/><text class="label" x="78" y="70">1 · Floor ray + hₐ → metric Xfloor</text><text class="small" x="78" y="100">2 · Floor bearing in B → solve one shared s</text><text class="small" x="78" y="126">3 · Scale t and triangulate the rest in metres</text>
  <rect class="note" x="730" y="36" width="415" height="112" rx="14"/><text class="label" x="753" y="70">Equal heights are not enough alone</text><text class="small" x="753" y="100">They constrain the baseline to be horizontal.</text><text class="small" x="753" y="126">A floor observation or another metric anchor fixes s.</text>
</svg>
