<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">PanorAi spatial-semantic graph overview</title>
  <desc id="desc">Prepared spherical views, pose, feature, depth, and semantic evidence are associated and localized before becoming a replayable heterogeneous graph with explicit uncertainty, provenance, archive, and query results.</desc>
  <defs>
    <style>
      .canvas{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font-family:Arial,sans-serif;font-size:24px;font-weight:700;fill:#0f172a}.heading{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#0f172a}.label{font-family:Arial,sans-serif;font-size:15px;font-weight:600;fill:#1e293b}.small{font-family:Arial,sans-serif;font-size:13px;fill:#64748b}.tiny{font-family:Menlo,monospace;font-size:12px;fill:#475569}.view{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.region-a{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.region-b{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.entity{fill:#ecfdf5;stroke:#059669;stroke-width:2.5}.candidate{fill:#faf5ff;stroke:#a855f7;stroke-width:2;stroke-dasharray:6 5}.edge{fill:none;stroke:#64748b;stroke-width:2}.evidence{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:5 5}.positive{fill:none;stroke:#059669;stroke-width:3}.ambiguous{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:6 4}.archive{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.query{fill:#f1f5f9;stroke:#475569;stroke-width:1.5}
      @media(prefers-color-scheme:dark){.canvas{fill:#0b1120}.panel{fill:#111827;stroke:#334155}.title,.heading,.label{fill:#f8fafc}.small,.tiny{fill:#cbd5e1}.view{fill:#082f49;stroke:#38bdf8}.region-a{fill:#2e1065;stroke:#a78bfa}.region-b{fill:#431407;stroke:#fb923c}.entity{fill:#052e2b;stroke:#34d399}.candidate{fill:#2e1065;stroke:#c084fc}.archive{fill:#172554;stroke:#60a5fa}.query{fill:#1e293b;stroke:#94a3b8}.edge,.evidence{stroke:#94a3b8}}
    </style>
  </defs>

  <rect class="canvas" width="1200" height="650" rx="22"/>
  <text class="title" x="40" y="45">From prepared evidence to a replayable spatial-semantic graph</text>
  <text class="small" x="40" y="70">The graph consumes typed results; it does not run the perception frontends.</text>

  <rect class="panel" x="30" y="95" width="335" height="430" rx="18"/>
  <text class="heading" x="52" y="130">1 · Prepared observations</text>
  <text class="small" x="52" y="153">frames · units · split · provenance</text>

  <rect class="view" x="55" y="178" width="285" height="82" rx="15"/>
  <text class="label" x="78" y="207">View V1</text><text class="small" x="78" y="230">pose + feature evidence</text>
  <rect class="region-a" x="253" y="194" width="66" height="23" rx="10"/><text class="tiny" x="266" y="210">chair</text>
  <rect class="region-b" x="253" y="225" width="66" height="23" rx="10"/><text class="tiny" x="266" y="241">table</text>

  <rect class="view" x="55" y="282" width="285" height="82" rx="15"/>
  <text class="label" x="78" y="311">View V2</text><text class="small" x="78" y="334">pose + depth evidence</text>
  <rect class="region-a" x="253" y="298" width="66" height="23" rx="10"/><text class="tiny" x="266" y="314">chair</text>
  <rect class="region-b" x="253" y="329" width="66" height="23" rx="10"/><text class="tiny" x="266" y="345">table</text>

  <rect class="view" x="55" y="386" width="285" height="82" rx="15"/>
  <text class="label" x="78" y="415">View V3</text><text class="small" x="78" y="438">pose; depth unavailable</text>
  <rect class="region-a" x="253" y="402" width="66" height="23" rx="10"/><text class="tiny" x="266" y="418">chair</text>
  <rect class="region-b" x="253" y="433" width="66" height="23" rx="10"/><text class="tiny" x="266" y="449">table?</text>

  <rect class="panel" x="395" y="95" width="370" height="430" rx="18"/>
  <text class="heading" x="417" y="130">2 · Association + localization</text>
  <text class="small" x="417" y="153">fail closed · preserve ambiguity</text>

  <rect class="candidate" x="430" y="188" width="300" height="72" rx="15"/>
  <text class="label" x="455" y="216">Region correspondence</text><text class="small" x="455" y="239">shared features · inliers · score</text>
  <line x1="365" y1="220" x2="425" y2="220" stroke="#64748b" stroke-width="3"/>
  <line x1="365" y1="325" x2="390" y2="325" stroke="#64748b" stroke-width="3"/><line x1="390" y1="325" x2="400" y2="245" stroke="#64748b" stroke-width="3"/><line x1="400" y1="245" x2="425" y2="245" stroke="#64748b" stroke-width="3"/>

  <rect x="430" y="292" width="300" height="102" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text class="label" x="455" y="322">Spatial posterior</text>
  <text class="small" x="455" y="347">angular · scale-free · metric</text>
  <text class="small" x="455" y="371">uncertainty remains part of the result</text>
  <line x1="580" y1="260" x2="580" y2="286" stroke="#64748b" stroke-width="3"/>
  <line x1="365" y1="428" x2="395" y2="428" stroke="#64748b" stroke-width="3"/><line x1="395" y1="428" x2="398" y2="360" stroke="#64748b" stroke-width="3"/><line x1="398" y1="360" x2="425" y2="360" stroke="#64748b" stroke-width="3"/>

  <rect class="query" x="430" y="426" width="300" height="66" rx="15"/>
  <text class="label" x="455" y="453">Conservative lifecycle policy</text><text class="small" x="455" y="476">proposed → ambiguous → confirmed</text>
  <line x1="580" y1="394" x2="580" y2="421" stroke="#64748b" stroke-width="3"/>

  <rect class="panel" x="795" y="95" width="375" height="430" rx="18"/>
  <text class="heading" x="817" y="130">3 · Heterogeneous graph</text>
  <text class="small" x="817" y="153">deterministic IDs · lineage · evidence</text>

  <circle class="view" cx="850" cy="225" r="33"/><text class="label" x="850" y="231" text-anchor="middle">V1</text>
  <circle class="view" cx="850" cy="326" r="33"/><text class="label" x="850" y="332" text-anchor="middle">V2</text>
  <circle class="view" cx="850" cy="427" r="33"/><text class="label" x="850" y="433" text-anchor="middle">V3</text>
  <line x1="850" y1="258" x2="850" y2="293" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/><line x1="850" y1="359" x2="850" y2="394" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>

  <rect class="entity" x="954" y="205" width="166" height="78" rx="18"/>
  <text class="label" x="1037" y="235" text-anchor="middle">Entity H1 · chair</text><text class="small" x="1037" y="259" text-anchor="middle">confirmed · metric</text>
  <rect class="entity" x="954" y="356" width="166" height="78" rx="18"/>
  <text class="label" x="1037" y="386" text-anchor="middle">Entity H2 · table</text><text class="small" x="1037" y="410" text-anchor="middle">ambiguous · angular</text>
  <line x1="883" y1="225" x2="954" y2="235" stroke="#059669" stroke-width="3"/>
  <line x1="883" y1="318" x2="954" y2="253" stroke="#059669" stroke-width="3"/>
  <line x1="883" y1="336" x2="954" y2="385" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="883" y1="420" x2="954" y2="400" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="765" y1="343" x2="790" y2="343" stroke="#64748b" stroke-width="3"/>

  <rect class="archive" x="30" y="550" width="735" height="70" rx="16"/>
  <text class="heading" x="54" y="580">Portable archive</text><text class="tiny" x="54" y="603">graph.jsonl  +  arrays/&lt;sha256&gt;.npz  ·  checksum-verified replay</text>
  <rect class="query" x="795" y="550" width="375" height="70" rx="16"/>
  <text class="heading" x="817" y="580">Queries with evidence</text><text class="small" x="817" y="603">spatial · embedding · text* · neighbors</text>
  <line x1="1037" y1="434" x2="1037" y2="545" stroke="#64748b" stroke-width="3"/>
</svg>
