<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Two spherical cameras and triangulation</title>
  <desc id="desc">Two camera centres observe a 3D point through panorama-frame bearing rays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e11d48"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="50" y="60" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Spherical two-view geometry</text>
  <circle cx="260" cy="470" r="24" fill="#2563eb"/>
  <circle cx="920" cy="470" r="24" fill="#e11d48"/>
  <circle cx="610" cy="150" r="18" fill="#0f172a"/>
  <path d="M260 470L610 150" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <path d="M920 470L610 150" stroke="#e11d48" stroke-width="5" marker-end="url(#b)"/>
  <path d="M282 500H894" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="205" y="530" font-family="system-ui,sans-serif" font-size="20" fill="#1d4ed8">camera A</text>
  <text x="865" y="530" font-family="system-ui,sans-serif" font-size="20" fill="#be123c">camera B</text>
  <text x="628" y="145" font-family="system-ui,sans-serif" font-size="20" fill="#0f172a">3D point X</text>
  <text x="385" y="282" font-family="ui-monospace,monospace" font-size="20" fill="#1d4ed8">λ · b₁</text>
  <text x="755" y="282" font-family="ui-monospace,monospace" font-size="20" fill="#be123c">μ · Rᵀb₂</text>
  <text x="510" y="538" font-family="ui-monospace,monospace" font-size="19" fill="#475569">baseline direction; metric scale unknown</text>
  <rect x="235" y="80" width="730" height="55" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="270" y="115" font-family="ui-monospace,monospace" font-size="22" fill="#0f172a">b₂ᵀ [t]× R b₁ = 0</text>
  <text x="590" y="115" font-family="system-ui,sans-serif" font-size="19" fill="#475569">— the Essential constraint uses bearings, not ERP pixels</text>
  <text x="210" y="585" font-family="system-ui,sans-serif" font-size="18" fill="#475569">Triangulation intersects the rays after pose estimation; near-parallel rays reveal low parallax.</text>
</svg>
