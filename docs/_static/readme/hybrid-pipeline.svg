<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">A PanorAi Pipeline can combine direct spherical and projected-view processing</title>
  <desc id="desc">An equirectangular raster field with support and validity branches into a direct OnSphere route and a SampleViews route. Raster view outputs reconstruct to ERP, detections lift to bearings, and all typed results meet in a ResultBundle.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eeeeee" stroke-width="1"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#0072BD"/></marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#D95319"/></marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#7E2F8E"/></marker>
    <marker id="arrowGray" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#595959"/></marker>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <rect x="1" y="1" width="1598" height="758" fill="none" stroke="#bfbfbf" stroke-width="2"/>
  <rect x="50" y="130" width="1500" height="545" fill="url(#grid)"/>
  <text x="70" y="62" fill="#262626" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Hybrid spherical pipeline</text>
  <text x="70" y="100" fill="#595959" font-family="Arial,Helvetica,sans-serif" font-size="22">Typed fields retain grid, support, validity, units, and execution provenance.</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="72" y="280" width="252" height="182" fill="#f5f9fc" stroke="#0072BD" stroke-width="3"/>
    <rect x="72" y="280" width="252" height="8" fill="#0072BD"/>
    <text x="198" y="323" text-anchor="middle" fill="#0072BD" font-size="18" font-weight="700">INPUT</text>
    <rect x="106" y="342" width="184" height="64" fill="#ffffff" stroke="#bfbfbf"/>
    <path d="M124 374Q198 342 272 374Q198 406 124 374Z" fill="#d9edf7" stroke="#0072BD" stroke-width="2.5"/>
    <path d="M124 374H272M198 343V405" stroke="#0072BD" stroke-opacity=".65" stroke-width="1.5"/>
    <text x="198" y="438" text-anchor="middle" fill="#262626" font-size="21" font-weight="700">ERP RasterField</text>
    <text x="198" y="489" text-anchor="middle" fill="#595959" font-size="17">values · support · validity</text>

    <rect x="408" y="162" width="304" height="150" fill="#f8fbfd" stroke="#0072BD" stroke-width="3"/>
    <rect x="408" y="162" width="304" height="8" fill="#0072BD"/>
    <text x="560" y="207" text-anchor="middle" fill="#0072BD" font-size="18" font-weight="700">DIRECT SPHERICAL ROUTE</text>
    <text x="560" y="251" text-anchor="middle" fill="#262626" font-size="28" font-weight="700">OnSphere</text>
    <text x="560" y="281" text-anchor="middle" fill="#595959" font-size="17">filter · SLIC · spherical layer</text>

    <rect x="408" y="448" width="304" height="150" fill="#fbf8f5" stroke="#D95319" stroke-width="3"/>
    <rect x="408" y="448" width="304" height="8" fill="#D95319"/>
    <text x="560" y="493" text-anchor="middle" fill="#D95319" font-size="18" font-weight="700">PROJECTED-VIEW ROUTE</text>
    <text x="560" y="537" text-anchor="middle" fill="#262626" font-size="28" font-weight="700">SampleViews</text>
    <text x="560" y="567" text-anchor="middle" fill="#595959" font-size="17">fibonacci · cubemap · custom specs</text>

    <rect x="800" y="420" width="300" height="208" fill="#faf8fb" stroke="#7E2F8E" stroke-width="3"/>
    <rect x="800" y="420" width="300" height="8" fill="#7E2F8E"/>
    <text x="950" y="464" text-anchor="middle" fill="#7E2F8E" font-size="18" font-weight="700">VIEW-LOCAL HEADS</text>
    <text x="950" y="507" text-anchor="middle" fill="#262626" font-size="28" font-weight="700">PerView.parallel</text>
    <rect x="832" y="536" width="108" height="52" fill="#ffffff" stroke="#D95319"/>
    <rect x="952" y="536" width="116" height="52" fill="#ffffff" stroke="#7E2F8E"/>
    <text x="886" y="568" text-anchor="middle" fill="#262626" font-size="16">depth</text>
    <text x="1010" y="568" text-anchor="middle" fill="#262626" font-size="16">detections</text>

    <rect x="1190" y="164" width="330" height="150" fill="#f8fbfd" stroke="#0072BD" stroke-width="3"/>
    <rect x="1190" y="164" width="330" height="8" fill="#0072BD"/>
    <text x="1355" y="208" text-anchor="middle" fill="#0072BD" font-size="18" font-weight="700">DIRECT RESULT</text>
    <text x="1355" y="252" text-anchor="middle" fill="#262626" font-size="27" font-weight="700">RasterField</text>
    <text x="1355" y="282" text-anchor="middle" fill="#595959" font-size="17">transformed RasterGrid</text>

    <rect x="1190" y="382" width="330" height="120" fill="#fbf8f5" stroke="#D95319" stroke-width="3"/>
    <rect x="1190" y="382" width="330" height="8" fill="#D95319"/>
    <text x="1355" y="425" text-anchor="middle" fill="#D95319" font-size="18" font-weight="700">RASTER HEADS</text>
    <text x="1355" y="468" text-anchor="middle" fill="#262626" font-size="26" font-weight="700">ReconstructERP</text>

    <rect x="1190" y="538" width="330" height="120" fill="#faf8fb" stroke="#7E2F8E" stroke-width="3"/>
    <rect x="1190" y="538" width="330" height="8" fill="#7E2F8E"/>
    <text x="1355" y="581" text-anchor="middle" fill="#7E2F8E" font-size="18" font-weight="700">NON-RASTER HEADS</text>
    <text x="1355" y="624" text-anchor="middle" fill="#262626" font-size="26" font-weight="700">LiftToBearings</text>
  </g>

  <path d="M324 341C360 341 374 238 408 238" fill="none" stroke="#0072BD" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M324 397C360 397 374 523 408 523" fill="none" stroke="#D95319" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M712 523H800" fill="none" stroke="#D95319" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M712 238H1190" fill="none" stroke="#0072BD" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1100 500C1140 500 1150 442 1190 442" fill="none" stroke="#D95319" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <path d="M1100 550C1140 550 1150 598 1190 598" fill="none" stroke="#7E2F8E" stroke-width="4" marker-end="url(#arrowPurple)"/>

  <rect x="1060" y="688" width="460" height="48" fill="#f2f2f2" stroke="#595959" stroke-width="2"/>
  <text x="1290" y="719" text-anchor="middle" fill="#262626" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">ResultBundle retains every named branch</text>
  <path d="M1520 239H1552M1520 442H1552M1520 598H1552M1552 239V712H1520" fill="none" stroke="#595959" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrowGray)"/>
</svg>
