[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panorai-streetview"
version = "0.1.0"
description = "Isolated local workspace for building navigable scenes with public PanorAi APIs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.24",
  "panorai>=3.8.1.dev0,<4",
  "Pillow>=9",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
panorai-streetview-import-stanford = "panorai_streetview.datasets:main"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
