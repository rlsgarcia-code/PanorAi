name: PanorAi CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-kernels:
    name: Native kernels / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install the native wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build ".[dev]"
          python -m build --wheel --outdir native-wheelhouse
          WHEEL="$(python scripts/select_compatible_wheel.py native-wheelhouse)"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
      - name: Require installed backend and verify parity outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/release_smoke.py" \
            --require-installed --require-native \
            --source-root "$GITHUB_WORKSPACE"
          python -m pytest -q -W error \
            --rootdir="$RUNNER_TEMP" --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_native_essential_kernels.py" \
            "$GITHUB_WORKSPACE/tests/test_native_geometry_kernels.py"

  core-tests:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify optional imports remain isolated
        run: >-
          python -c "import sys, panorai, panorai.geometry;
          assert 'torch' not in sys.modules;
          assert 'open3d' not in sys.modules"
      - name: Type-check the canonical NumPy API
        run: mypy --strict --follow-imports=silent tests/typing/geometry_api.py
      - name: Run tests with warnings as errors
        run: pytest -q -W error

  dependency-bounds:
    name: Dependency bounds / ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: oldest
            python-version: "3.11"
            requirements: >-
              numpy==1.26.4 opencv-python-headless==4.9.0.80 Pillow==9.5.0
              pydantic==2.0.3 PyYAML==6.0 scikit-image==0.22.0 scipy==1.10.1
          - id: newest
            python-version: "3.14"
            requirements: >-
              numpy<3 opencv-python-headless<5 Pillow pydantic<3 PyYAML
              scikit-image scipy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the dependency boundary and source
        env:
          DEPENDENCY_REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install $DEPENDENCY_REQUIREMENTS pytest
          python -m pip install --no-deps .
          python -m pip check
      - name: Exercise the stable dependency boundary
        run: |
          pytest -q -W error \
            tests/test_geometry_contract.py \
            tests/test_geometry_conformance.py \
            tests/test_geometry_composition.py \
            tests/test_geometry_invalid_policy.py \
            tests/test_geometry_properties.py \
            tests/test_spherical_features.py \
            tests/test_stability_contract.py

  torch-cpu:
    name: Torch CPU parity and autograd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU Torch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install ".[dev]"
      - name: Run parity and autograd tests
        run: pytest -q -W error tests/test_geometry_torch.py
      - name: Type-check the optional Torch API
        run: mypy --strict --follow-imports=silent tests/typing/geometry_torch_api.py

  fixture-integrity-windows:
    name: Geometry fixtures / Windows checkout
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify byte-exact geometry-v1 fixtures after checkout
        run: python scripts/verify_geometry_fixture_integrity.py

  build-wheels:
    name: Wheel / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: manylinux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - id: manylinux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - id: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - id: macos-arm64
            os: macos-14
            arch: arm64
          - id: windows-amd64
            os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix reproducible wheel timestamps
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-wheels-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build candidate sdist once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-artifacts:
    name: Assemble candidate artifacts once
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist/
          merge-multiple: true
      - name: Validate complete artifact matrix
        run: |
          python -m pip install --upgrade pip twine
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = "20"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = "1"
          python -m twine check dist/*
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-dists
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  artifact-policy:
    name: Artifact content and license policy
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-dists
      - name: Audit both candidate artifacts
        run: python scripts/audit_release_artifacts.py dist/*

  installed-wheel:
    name: Installed wheel / Python ${{ matrix.python-version }}
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: candidate-dists
      - name: Install the built wheel
        run: |
          python -m pip install --upgrade pip packaging
          WHEEL="$(python scripts/select_compatible_wheel.py dist)"
          python -m pip install "$WHEEL"
          python -m pip check
      - name: Prove installed origin and smoke-test
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/release_smoke.py" \
            --require-installed --require-native \
            --source-root "$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/scripts/run_geometry_conformance.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/geometry/v1"
          python "$GITHUB_WORKSPACE/scripts/run_geometry_oracle.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/geometry/v1"
          python "$GITHUB_WORKSPACE/scripts/run_documentation_examples.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE"
          python -c "from importlib.resources import files; assert files('panorai').joinpath('py.typed').is_file()"
      - name: Run installed-wheel Torch documentation example
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/run_documentation_examples.py" \
            --torch --require-installed --source-root "$GITHUB_WORKSPACE"

  docs:
    name: Documentation (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build documentation with warnings as errors
        run: |
          python -m pip install --upgrade pip ".[docs]"
          sphinx-build -b html -n -W --keep-going docs _site
