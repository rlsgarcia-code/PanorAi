name: Upload Obfuscated Python Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools and PyArmor 7.x
        run: |
          python -m pip install --upgrade pip setuptools wheel build "pyarmor<8"

      - name: Obfuscate the package with PyArmor 7.x
        run: |
          # Clean up potential __pycache__ directories first (optional but recommended)
          find panorai -name '__pycache__' -exec rm -rf {} +
          
          mkdir -p obfuscated/panorai
          pyarmor obfuscate --exact --exclude __init__.py -O obfuscated/panorai panorai
          cp panorai/__init__.py obfuscated/panorai/  # Copy the public __init__.py
          cp setup.py README.md MANIFEST.in obfuscated/
          cp LICENSE pyproject.toml obfuscated/ || true

          # Manually copy missing subdirectories:
          cp -r panorai/blenders obfuscated/panorai/
          cp -r panorai/config obfuscated/panorai/
          cp -r panorai/data obfuscated/panorai/
          cp -r panorai/factory obfuscated/panorai/
          cp -r panorai/pcd obfuscated/panorai/
          cp -r panorai/preprocessing obfuscated/panorai/
          cp -r panorai/projections obfuscated/panorai/
          cp -r panorai/samplers obfuscated/panorai/
          cp -r panorai/utils obfuscated/panorai/

      - name: Build obfuscated wheel
        working-directory: obfuscated
        run: python -m build

      - name: Debug file layout
        run: find obfuscated/panorai

      - name: Smoke test
        working-directory: obfuscated
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          python -c "from panorai import EquirectangularImage, PanoraiFactory; print('✅ All good')"

      - name: Upload obfuscated wheel
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: obfuscated/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/manage/project/panorai

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/