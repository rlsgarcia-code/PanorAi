name: Release PanorAi

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: "3.3.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and SCM version
        run: |
          test "${{ github.event.release.tag_name }}" = "v${RELEASE_VERSION}"
          python -m pip install --upgrade "setuptools-scm>=8"
          test "$(python -m setuptools_scm)" = "${RELEASE_VERSION}"

  test-core:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify optional backends stay unloaded
        run: |
          python -c "import sys, panorai, panorai.geometry; assert 'torch' not in sys.modules; assert 'open3d' not in sys.modules"
      - name: Run test suite
        run: pytest -q -W error

  test-torch-cpu:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Torch backend and tests
        run: python -m pip install --upgrade pip ".[dev,torch]"
      - name: Run mandatory CPU parity and autograd tests
        run: pytest -q -W error tests/test_geometry_torch.py

  build-wheels:
    needs: [test-core, test-torch-cpu]
    name: Wheel / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: manylinux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - id: manylinux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - id: macos-x86_64
            os: macos-15-intel
            arch: x86_64
          - id: macos-arm64
            os: macos-14
            arch: arm64
          - id: windows-amd64
            os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Fix reproducible wheel timestamps
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.id }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    needs: [test-core, test-torch-cpu]
    name: Build release sdist once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix reproducible archive timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build and normalize sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
          python scripts/normalize_sdist.py \
            "dist/panorai-${RELEASE_VERSION}.tar.gz" \
            --epoch "$SOURCE_DATE_EPOCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    needs: [build-wheels, build-sdist]
    name: Assemble and attest release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true
      - name: Validate complete metadata and package matrix
        run: |
          python -m pip install --upgrade twine
          test "$(find dist -maxdepth 1 -name "panorai-${RELEASE_VERSION}-*.whl" | wc -l)" = "20"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" = "20"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = "1"
          python -m twine check dist/*
          python scripts/audit_release_artifacts.py dist/*
          test -f "dist/panorai-${RELEASE_VERSION}.tar.gz"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  install-wheel:
    needs: build
    name: Installed wheel / ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: manylinux-x86_64-py311
            os: ubuntu-latest
            python-version: "3.11"
          - id: manylinux-x86_64-py312
            os: ubuntu-latest
            python-version: "3.12"
          - id: manylinux-x86_64-py313
            os: ubuntu-latest
            python-version: "3.13"
          - id: manylinux-x86_64-py314
            os: ubuntu-latest
            python-version: "3.14"
          - id: manylinux-aarch64-py311
            os: ubuntu-24.04-arm
            python-version: "3.11"
          - id: manylinux-aarch64-py312
            os: ubuntu-24.04-arm
            python-version: "3.12"
          - id: manylinux-aarch64-py313
            os: ubuntu-24.04-arm
            python-version: "3.13"
          - id: manylinux-aarch64-py314
            os: ubuntu-24.04-arm
            python-version: "3.14"
          - id: macos-x86_64-py311
            os: macos-15-intel
            python-version: "3.11"
          - id: macos-x86_64-py312
            os: macos-15-intel
            python-version: "3.12"
          - id: macos-x86_64-py313
            os: macos-15-intel
            python-version: "3.13"
          - id: macos-x86_64-py314
            os: macos-15-intel
            python-version: "3.14"
          - id: macos-arm64-py311
            os: macos-14
            python-version: "3.11"
          - id: macos-arm64-py312
            os: macos-14
            python-version: "3.12"
          - id: macos-arm64-py313
            os: macos-14
            python-version: "3.13"
          - id: macos-arm64-py314
            os: macos-14
            python-version: "3.14"
          - id: windows-amd64-py311
            os: windows-latest
            python-version: "3.11"
          - id: windows-amd64-py312
            os: windows-latest
            python-version: "3.12"
          - id: windows-amd64-py313
            os: windows-latest
            python-version: "3.13"
          - id: windows-amd64-py314
            os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip packaging
          WHEEL="$(python scripts/select_compatible_wheel.py dist)"
          python -m pip install "$WHEEL"
          python -m pip check
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/release_smoke.py" \
            --require-installed --require-native \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION"
          python "$GITHUB_WORKSPACE/scripts/run_geometry_conformance.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/geometry/v1"
          python "$GITHUB_WORKSPACE/scripts/run_geometry_oracle.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/geometry/v1"
          python "$GITHUB_WORKSPACE/scripts/run_documentation_examples.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION"

  build-docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build documentation
        run: |
          python -m pip install --upgrade pip ".[docs]"
          sphinx-build -b html -n -W --keep-going docs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish-testpypi:
    needs: [install-wheel, build-docs]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/panorai
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  smoke-testpypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Verify TestPyPI serves the exact release artifacts
        run: |
          python "$GITHUB_WORKSPACE/scripts/verify_index_artifacts.py" \
            --index-url https://test.pypi.org/pypi \
            --distribution panorai --version "$RELEASE_VERSION" \
            dist/panorai-*
          mkdir -p "$RUNNER_TEMP/testpypi-dist"
          for attempt in 1 2 3 4 5 6; do
            rm -f "$RUNNER_TEMP/testpypi-dist"/panorai-*
            if python -m pip download --no-cache-dir --no-deps \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --only-binary=panorai \
              --dest "$RUNNER_TEMP/testpypi-dist" \
              "panorai==${RELEASE_VERSION}" \
              && python -m pip download --no-cache-dir --no-deps \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              --no-binary=panorai \
              --dest "$RUNNER_TEMP/testpypi-dist" \
              "panorai==${RELEASE_VERSION}" \
              && test "$(find "$RUNNER_TEMP/testpypi-dist" \
              -maxdepth 1 -type f -name 'panorai-*' | wc -l)" = "2"; then
              break
            fi
            test "$attempt" != "6"
            sleep 10
          done
      - name: Install from TestPyPI and run NumPy/Torch smoke tests
        run: |
          for attempt in 1 2 3 4 5 6; do
            python -m pip install --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "panorai[torch]==${RELEASE_VERSION}" && break
            test "$attempt" != "6"
            sleep 10
          done
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/release_smoke.py" --torch \
            --require-installed --require-native \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION"
          python "$GITHUB_WORKSPACE/scripts/run_geometry_conformance.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/geometry/v1"
          python "$GITHUB_WORKSPACE/scripts/run_geometry_oracle.py" \
            --require-installed --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION" \
            --fixtures-root "$GITHUB_WORKSPACE/tests/fixtures/geometry/v1" \
            --require-torch-gradcheck
          python "$GITHUB_WORKSPACE/scripts/run_documentation_examples.py" \
            --torch --require-installed --source-root "$GITHUB_WORKSPACE" \
            --expected-version "$RELEASE_VERSION"

  publish-pypi:
    needs: smoke-testpypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/panorai
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  finalize-release:
    needs: [publish-pypi, build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: read
      pages: write
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Create checksums and download provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum panorai-* > SHA256SUMS
          mkdir provenance
          for artifact in panorai-*; do
            (cd provenance && gh attestation download "../${artifact}" --repo "${{ github.repository }}")
          done
      - name: Attach artifacts, checksums, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/panorai-* dist/SHA256SUMS dist/provenance/* --clobber
          --repo "${{ github.repository }}"
      - name: Publish documentation to GitHub Pages
        uses: actions/deploy-pages@v4
