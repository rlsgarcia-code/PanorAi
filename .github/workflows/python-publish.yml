name: Upload Obfuscated Python Package

on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
# ─────────────────────────────────────────────────────────────────────────────
  release-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    #--------------------------------------------------------- build + obfuscate
    - name: Install build tools, PyArmor 7.x and mypy (stubgen)
      run: |
        pip install --upgrade pip setuptools wheel build "pyarmor<8" mypy

    - name: Obfuscate PanorAi with PyArmor 7.x
      run: |
        find panorai -name '__pycache__' -exec rm -rf {} +
        mkdir -p obfuscated/panorai
        pyarmor obfuscate --exact --exclude __init__.py -O obfuscated/panorai panorai
        cp panorai/__init__.py obfuscated/panorai/
        cp setup.py README.md MANIFEST.in obfuscated/
        cp LICENSE pyproject.toml requirements.txt obfuscated/ || true
        rsync -a --ignore-existing panorai/ obfuscated/panorai/

    #------------------------------------------------------------- type stubs
    - name: Generate PEP 561 stubs
      run: |
        stubgen --no-import panorai -o stubs
        rsync -a --ignore-existing stubs/panorai/ obfuscated/panorai/

    #--------------------------------------------------------- build wheel
    - name: Build wheel
      working-directory: obfuscated
      run: python -m build

    #--------------------------------------------------------- install wheel globally
    - name: Install wheel into runner Python
      run: pip install obfuscated/dist/*.whl

    #--------------------------------------------------------- quick smoke test
    - name: Smoke test import
      run: python -c "from panorai import EquirectangularImage, PanoraiFactory; print('✅ PanorAi imports OK')"

    #--------------------------------------------------------- docs build
    - name: Build documentation
      run: |
        pip install --no-cache-dir \
          numpy sphinx furo sphinx-copybutton sphinx-design \
          myst-nb sphinxcontrib-mermaid sphinxcontrib-spelling \
          sphinx-rtd-theme
        sphinx-build -M html docs docs/_build

    #--------------------------------------------------------- upload artifacts
    - name: Upload documentation
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

    - name: Upload obfuscated wheel
      uses: actions/upload-artifact@v4
      with:
        name: release-dists
        path: obfuscated/dist/

# ─────────────────────────────────────────────────────────────────────────────
  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/manage/project/panorai
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-dists
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

# ─────────────────────────────────────────────────────────────────────────────
  deploy-docs:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v2
