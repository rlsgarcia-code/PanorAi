name: Upload Obfuscated Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools and PyArmor
        run: |
          python -m pip install --upgrade pip setuptools wheel build pyarmor

      - name: Obfuscate the package with PyArmor (cross-platform)
        run: |
          mkdir -p obfuscated/panorai

          # Obfuscate from source to obfuscated output dir
          pyarmor gen --platform all -O obfuscated/panorai panorai

          # Copy setup and other necessary files
          cp setup.py obfuscated/
          # Optional: copy README.md, LICENSE, etc.
          # cp README.md LICENSE pyproject.toml obfuscated/

      - name: Build obfuscated wheel
        working-directory: obfuscated
        run: python -m build

      - name: Upload obfuscated wheel
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: obfuscated/dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/manage/project/panorai

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/