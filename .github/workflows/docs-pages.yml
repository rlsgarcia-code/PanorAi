name: Publish current PanorAi documentation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "contracts/**"
      - "docs/**"
      - "panorai/**"
      - "scripts/run_documentation_examples.py"
      - "pyproject.toml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: current-documentation-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build strict documentation from main
        run: |
          python -m pip install --upgrade pip ".[docs]" "pytest>=8,<10" "jsonschema>=4,<5" "PyYAML>=6,<7"
          python -m pytest -q \
            tests/test_stability_contract.py \
            tests/test_documentation_examples.py \
            tests/test_application_extension_contract.py \
            tests/test_ci_contract.py
          python scripts/run_documentation_examples.py --source-checkout
          python scripts/sync_public_catalog.py --check
          sphinx-build -E -b html -n -W --keep-going docs _site
          python scripts/verify_public_catalog_docs.py _site
      - name: Verify public documentation routes
        run: |
          test -f _site/index.html
          test -f _site/reference/catalog/index.html
          test -f _site/reference/catalog/public_surfaces.html
          test -f _site/concepts/index.html
          test -f _site/guides/index.html
          test -f _site/development/application_extensions.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish current main documentation
        id: deployment
        uses: actions/deploy-pages@v4
